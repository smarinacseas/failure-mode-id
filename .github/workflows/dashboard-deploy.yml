name: Deploy ConstraintLens

# The dashboard is a static bundle: `dashboard/index.html` (unpacked from
# the Claude Design bundle), `support.js`, `fonts/`, plus `runs.json` and
# per-experiment `<slug>.json` files that `scripts/dashboard_sync.py`
# writes at aggregate time. No build step is needed — we upload the folder
# as-is to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
